<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú · Los Pares 84×88</title>
<style>
  :root{ --oro:#d4af37; --naranja:#e1622c; --carbon:#111; --carbon2:#1c1c1c; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 50% 0%, #222 0%, var(--carbon) 60%);
    color:#f4f4f4; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:32px 20px 48px;
  }
  .marca{ text-align:center; margin-bottom:6px; }
  .marca h1{ font-size:34px; letter-spacing:1px; }
  .marca h1 .b{ color:var(--oro); }
  .marca .sub{ color:var(--oro); letter-spacing:6px; font-size:14px; margin-top:2px; }
  .tag{ color:#bbb; font-size:14px; margin:14px 0 28px; text-align:center; }
  .menus{ width:100%; max-width:420px; display:flex; flex-direction:column; gap:16px; }
  a.card{
    display:flex; align-items:center; gap:16px;
    background:var(--carbon2); border:1px solid #333; border-radius:16px;
    padding:20px 22px; text-decoration:none; color:#f4f4f4;
    transition:transform .08s ease, border-color .2s ease;
  }
  a.card:active{ transform:scale(.98); }
  a.card:hover{ border-color:var(--oro); }
  .emoji{ font-size:34px; width:44px; text-align:center; }
  .txt .t{ font-size:20px; font-weight:700; }
  .txt .d{ font-size:13px; color:#aaa; margin-top:2px; }
  .flecha{ margin-left:auto; color:var(--oro); font-size:22px; }
  .pie{ margin-top:34px; text-align:center; color:#888; font-size:13px; line-height:1.6; }
  .pie a{ color:var(--oro); text-decoration:none; }
</style>
</head>
<body>
  <div class="marca">
    <h1>Los <span class="b">Pares</span></h1>
    <div class="sub">84 × 88</div>
  </div>
  <p class="tag">🥩 Elige el menú que quieres ver</p>

  <div class="menus">
    <a class="card" href="Desayunos.pdf" target="_blank" rel="noopener">
      <span class="emoji">🍳</span>
      <span class="txt"><div class="t">Desayunos</div><div class="d">Para empezar el día</div></span>
      <span class="flecha">→</span>
    </a>
    <a class="card" href="Comida.pdf" target="_blank" rel="noopener">
      <span class="emoji">🍽️</span>
      <span class="txt"><div class="t">Comida</div><div class="d">Cortes y platillos</div></span>
      <span class="flecha">→</span>
    </a>
    <a class="card" href="Bebidas.pdf" target="_blank" rel="noopener">
      <span class="emoji">🥤</span>
      <span class="txt"><div class="t">Bebidas</div><div class="d">Refrescos, cocteles y más</div></span>
      <span class="flecha">→</span>
    </a>
  </div>

  <div class="pie">
    Los Pares 84×88 · Tuxtepec, Oaxaca<br>
    Haz tu pedido por WhatsApp 📲
  </div>
</body>
</html>
