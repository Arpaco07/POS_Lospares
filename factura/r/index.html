<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Los Pares 84x88 — Déjanos tu reseña</title>
<meta name="robots" content="noindex">

<!-- ============================================================
     LOS PARES 84x88 — ATAJO PARA LA RESEÑA DE GOOGLE
     Esta página no se ve: rebota sola a Google en cuanto abre.

     PARA QUE SIRVE: la dirección de reseñas de Google es larguísima
     (79 caracteres) y por eso su código QR salía más grande que el
     de factura. Esta página tiene una dirección corta
     (factura.lospares.com/r), así el QR queda del mismo tamaño.

     SI ALGUNA VEZ CAMBIA EL ENLACE DE RESEÑAS, solo cambia la línea
     de abajo que dice GOOGLE = "...".
     ============================================================ -->

<script>
  var GOOGLE = "https://search.google.com/local/writereview?placeid=ChIJ2anW5wPnw4URM9xCy5obZYU";
  // replace() para que el botón "atrás" del celular no regrese aquí
  try { location.replace(GOOGLE); } catch (e) { location.href = GOOGLE; }
</script>

<!-- Respaldo por si el celular trae el JavaScript apagado -->
<noscript>
  <meta http-equiv="refresh"
        content="0; url=https://search.google.com/local/writereview?placeid=ChIJ2anW5wPnw4URM9xCy5obZYU">
</noscript>

<style>
  :root{ --dorado:#d4af37; --naranja:#e1622c; }
  html,body{height:100%}
  body{
    margin:0; background:#121212; color:#f2efe6;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:28px; box-sizing:border-box;
  }
  .caja{max-width:420px}
  h1{font-size:22px; margin:0 0 10px; color:var(--dorado); letter-spacing:.5px}
  p{font-size:16px; line-height:1.5; margin:0 0 22px; color:#cfc9bb}
  a.btn{
    display:inline-block; background:var(--naranja); color:#fff;
    text-decoration:none; font-weight:700; font-size:17px;
    padding:14px 26px; border-radius:12px;
  }
  .chico{margin-top:26px; font-size:13px; color:#8c867a}
</style>
</head>
<body>
  <div class="caja">
    <h1>LOS PARES 84&times;88</h1>
    <p>Te estamos llevando a Google para que nos dejes tu reseña…</p>
    <a class="btn"
       href="https://search.google.com/local/writereview?placeid=ChIJ2anW5wPnw4URM9xCy5obZYU">
       Escribir mi reseña
    </a>
    <div class="chico">Si no abre solo, toca el botón.</div>
  </div>
</body>
</html>
